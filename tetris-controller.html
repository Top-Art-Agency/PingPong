<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TETRIS — Kontroler</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');
  :root{ --phosphor:#35FF6E; --phosphor-dim:#1B7A38; --bg:#050807; --amber:#FFB000; }
  body.light{ --phosphor:#12833F; --phosphor-dim:#6E9E82; --bg:#EEF3EE; --amber:#B36A00; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;overscroll-behavior:none;}
  body{ background:var(--bg); color:var(--phosphor); font-family:'Space Mono', monospace; display:flex; flex-direction:column; touch-action:none; overflow:hidden; transition:background .2s; }
  header{ padding:14px 16px 8px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .logo{ font-family:'Press Start 2P', monospace; font-size:15px; letter-spacing:2px; text-shadow:0 0 6px var(--phosphor); }
  .logo span{ color:var(--amber); text-shadow:0 0 6px var(--amber); }
  .toolbar{ display:flex; gap:6px; }
  .icon-btn{ font-family:'Space Mono', monospace; font-size:10px; background:transparent; color:var(--phosphor); border:1px solid var(--phosphor-dim); padding:6px 8px; border-radius:4px; cursor:pointer; min-width:32px; }
  .status-row{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:10px; margin:0 0 4px; color:var(--phosphor-dim); flex-shrink:0; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#555; flex-shrink:0; }
  .dot.connecting{ background:var(--amber); box-shadow:0 0 8px var(--amber); animation:pulse 1s infinite; }
  .dot.connected{ background:var(--phosphor); box-shadow:0 0 8px var(--phosphor); }
  .dot.error{ background:#FF5D5D; box-shadow:0 0 8px #FF5D5D; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  #nameRow{ padding:0 16px 8px; flex-shrink:0; }
  #inputName{ width:100%; font-family:'Space Mono', monospace; font-size:14px; background:rgba(53,255,110,0.04); color:var(--phosphor); border:1px solid var(--phosphor-dim); border-radius:6px; padding:10px 12px; outline:none; }
  #inputName::placeholder{ color:var(--phosphor-dim); opacity:0.7; }
  #nickHint{ margin:0 16px 8px; padding:8px 10px; border:1px solid var(--amber); border-radius:6px; background:rgba(255,176,0,0.08); color:var(--amber); font-size:10.5px; letter-spacing:0.3px; text-align:center; line-height:1.4; }
  #colorRow{ display:flex; gap:8px; padding:0 16px 8px; flex-shrink:0; justify-content:center; }
  .swatch{ width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,0.15); cursor:pointer; flex-shrink:0; transition:transform .1s, border-color .1s; }
  .swatch.selected{ border-color:#fff; transform:scale(1.15); box-shadow:0 0 10px currentColor; }

  #pads{ flex:1; display:flex; flex-direction:column; gap:8px; padding:6px 14px 16px; min-height:0; }
  .btn{ border:2px solid var(--phosphor-dim); border-radius:14px; display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P', monospace; font-size:clamp(14px,5vw,22px); color:var(--phosphor-dim); background:rgba(53,255,110,0.03); transition:background .06s,color .06s,border-color .06s; }
  .btn.active{ color:var(--phosphor); border-color:var(--phosphor); background:rgba(53,255,110,0.18); box-shadow:0 0 30px rgba(53,255,110,0.25) inset; }
  #rowMove{ flex:2.2; display:flex; gap:8px; }
  #rowMove .btn{ flex:1; font-size:clamp(20px,8vw,32px); }
  #btnRotate{ flex:1.3; }
  #btnHard{ flex:1; color:var(--amber); border-color:var(--amber); font-size:clamp(16px,6vw,24px); }
  #btnHard.active{ background:rgba(255,176,0,0.2); box-shadow:0 0 30px rgba(255,176,0,0.3) inset; }
</style>
</head>
<body>
<header>
  <div class="logo"><span>TETRIS</span></div>
  <div class="toolbar">
    <button class="icon-btn" id="btnLang" title="Language">EN</button>
    <button class="icon-btn" id="btnTheme" title="Theme">🌙</button>
    <button class="icon-btn" id="btnFullscreen" title="Fullscreen">⛶</button>
  </div>
</header>
<div class="status-row"><div class="dot connecting" id="dot"></div><span id="statusLabel">Łączenie z ekranem…</span></div>
<div id="nickHint">✏️ Podaj swój nick — inaczej pojawisz się w wynikach jako „?”</div>
<div id="nameRow"><input type="text" id="inputName" maxlength="16" placeholder="Twoje imię (opcjonalnie)"></div>
<div id="colorRow"></div>
<div id="pads">
  <div id="rowMove">
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnRotate">⟳</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
  <div class="btn" id="btnHard">⤓ UPUŚĆ</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = { dot:$('dot'), statusLabel:$('statusLabel'), btnLang:$('btnLang'), btnTheme:$('btnTheme'),
    btnFullscreen:$('btnFullscreen'), inputName:$('inputName'), nickHint:$('nickHint'), colorRow:$('colorRow'),
    btnRotate:$('btnRotate'), btnLeft:$('btnLeft'), btnRight:$('btnRight'), btnHard:$('btnHard') };

  const STR = { pl:{ connecting:'Łączenie z ekranem…', connected:'Połączono z ekranem', full:'Ekran jest już pełny — spróbuj później',
      disconnected:'Rozłączono — odśwież stronę', noCode:'Brak kodu ekranu w linku — zeskanuj QR jeszcze raz',
      errorPrefix:'Błąd: ', namePlaceholder:'Twoje imię (opcjonalnie)',
      nickHint:'✏️ Podaj swój nick — inaczej pojawisz się w wynikach jako „?”' },
    en:{ connecting:'Connecting to screen…', connected:'Connected to screen', full:'Screen is already full — try again later',
      disconnected:'Disconnected — refresh the page', noCode:'No screen code in the link — scan the QR again',
      errorPrefix:'Error: ', namePlaceholder:'Your name (optional)',
      nickHint:'✏️ Enter your nickname — otherwise you will show up as "?" in the results' } };
  let lang='pl', statusState='connecting';
  function t(k){ return STR[lang][k]; }
  function renderStatus(){ el.statusLabel.textContent = t(statusState); }
  function renderStaticTexts(){ el.inputName.placeholder = t('namePlaceholder'); el.nickHint.textContent = t('nickHint'); renderStatus(); }
  el.btnLang.addEventListener('click', () => { lang=lang==='pl'?'en':'pl'; el.btnLang.textContent=lang==='pl'?'EN':'PL'; renderStaticTexts(); });
  el.btnTheme.addEventListener('click', () => { document.body.classList.toggle('light'); el.btnTheme.textContent = document.body.classList.contains('light')?'☀️':'🌙'; });
  el.btnFullscreen.addEventListener('click', () => { if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{});} else { document.exitFullscreen().catch(()=>{});} });

  const params = new URLSearchParams(window.location.search);
  const hostId = params.get('code');
  let conn = null;

  const COLORS = ['#35FF6E', '#FFB000', '#3FE0FF', '#FF5D5D', '#D45DFF', '#FFEC5D'];
  let selectedColor = null;
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'swatch'; sw.style.background = c; sw.style.color = c;
    sw.addEventListener('click', () => {
      selectedColor = c;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      sendMeta();
    });
    el.colorRow.appendChild(sw);
  });

  function sendMeta(){ if (conn && conn.open) conn.send({ name: el.inputName.value.trim().slice(0,16), color: selectedColor }); }
  let nameDebounce=null;
  el.inputName.addEventListener('input', () => { clearTimeout(nameDebounce); nameDebounce=setTimeout(sendMeta, 300); });

  let held = { left:false, right:false, down:false };
  function sendHold(){ if (conn && conn.open) conn.send({ type:'hold', left:held.left, right:held.right, down:held.down, name: el.inputName.value.trim().slice(0,16), color: selectedColor }); }
  function sendAction(action){ if (conn && conn.open) conn.send({ type:'action', action, name: el.inputName.value.trim().slice(0,16), color: selectedColor }); }

  if (!hostId){ statusState='noCode'; el.dot.className='dot error'; }
  else {
    statusState='connecting'; el.dot.className='dot connecting';
    const peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(hostId, { reliable:false });
      conn.on('open', () => { statusState='connected'; el.dot.className='dot connected'; renderStatus(); sendMeta(); });
      conn.on('data', (data) => { if (data && data.type==='full'){ statusState='full'; el.dot.className='dot error'; renderStatus(); } });
      conn.on('close', () => { statusState='disconnected'; el.dot.className='dot error'; renderStatus(); });
    });
    peer.on('error', (err) => { el.statusLabel.textContent = t('errorPrefix')+err.type; el.dot.className='dot error'; });
  }

  function bindHold(btn, key){
    const start = (e) => { e.preventDefault(); held[key]=true; btn.classList.add('active'); sendHold(); };
    const end = (e) => { e.preventDefault(); held[key]=false; btn.classList.remove('active'); sendHold(); };
    btn.addEventListener('touchstart', start, {passive:false});
    btn.addEventListener('touchend', end, {passive:false});
    btn.addEventListener('touchcancel', end, {passive:false});
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
  }
  bindHold(el.btnLeft, 'left');
  bindHold(el.btnRight, 'right');

  function bindTap(btn, action){
    const fire = (e) => {
      e.preventDefault();
      btn.classList.add('active'); setTimeout(()=>btn.classList.remove('active'), 100);
      sendAction(action);
    };
    btn.addEventListener('touchstart', fire, {passive:false});
    btn.addEventListener('mousedown', fire);
  }
  bindTap(el.btnRotate, 'rotate');
  bindTap(el.btnHard, 'harddrop');

  setInterval(sendHold, 200);
  window.addEventListener('keydown', (e) => {
    if (e.key==='ArrowLeft'){ held.left=true; sendHold(); }
    if (e.key==='ArrowRight'){ held.right=true; sendHold(); }
    if (e.key==='ArrowDown'){ held.down=true; sendHold(); }
    if (e.key==='ArrowUp'){ sendAction('rotate'); }
    if (e.key===' '){ sendAction('harddrop'); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key==='ArrowLeft'){ held.left=false; sendHold(); }
    if (e.key==='ArrowRight'){ held.right=false; sendHold(); }
    if (e.key==='ArrowDown'){ held.down=false; sendHold(); }
  });
  window.addEventListener('beforeunload', () => { held={left:false,right:false,down:false}; sendHold(); });

  renderStaticTexts();
})();
</script>
</body>
</html>
