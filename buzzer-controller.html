<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BUZZER — Kontroler</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');
  :root{ --phosphor:#35FF6E; --phosphor-dim:#1B7A38; --bg:#050807; --amber:#FFB000; }
  body.light{ --phosphor:#12833F; --phosphor-dim:#6E9E82; --bg:#EEF3EE; --amber:#B36A00; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;overscroll-behavior:none;}
  body{ background:var(--bg); color:var(--phosphor); font-family:'Space Mono', monospace; display:flex; flex-direction:column; touch-action:none; overflow:hidden; transition:background .2s; }
  header{ padding:14px 16px 8px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .logo{ font-family:'Press Start 2P', monospace; font-size:15px; letter-spacing:2px; text-shadow:0 0 6px var(--phosphor); }
  .logo span{ color:var(--amber); text-shadow:0 0 6px var(--amber); }
  .toolbar{ display:flex; gap:6px; }
  .icon-btn{ font-family:'Space Mono', monospace; font-size:10px; background:transparent; color:var(--phosphor); border:1px solid var(--phosphor-dim); padding:6px 8px; border-radius:4px; cursor:pointer; min-width:32px; }
  .status-row{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:10px; margin:0 0 4px; color:var(--phosphor-dim); flex-shrink:0; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#555; flex-shrink:0; }
  .dot.connecting{ background:var(--amber); box-shadow:0 0 8px var(--amber); animation:pulse 1s infinite; }
  .dot.connected{ background:var(--phosphor); box-shadow:0 0 8px var(--phosphor); }
  .dot.error{ background:#FF5D5D; box-shadow:0 0 8px #FF5D5D; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  #nameRow{ padding:0 16px 8px; flex-shrink:0; }
  #inputName{ width:100%; font-family:'Space Mono', monospace; font-size:14px; background:rgba(53,255,110,0.04); color:var(--phosphor); border:1px solid var(--phosphor-dim); border-radius:6px; padding:10px 12px; outline:none; }
  #inputName::placeholder{ color:var(--phosphor-dim); opacity:0.7; }
  #scoreRow{ text-align:center; font-size:11px; color:var(--phosphor-dim); letter-spacing:1px; padding-bottom:6px; flex-shrink:0; }
  #scoreRow b{ color:var(--phosphor); font-family:'Press Start 2P', monospace; font-size:14px; }
  #buzzBtn{ flex:1; margin:8px 14px 18px; border:3px solid var(--phosphor-dim); border-radius:24px; display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P', monospace; font-size:clamp(24px,10vw,42px); color:var(--phosphor-dim); background:rgba(53,255,110,0.03); transition:background .06s,color .06s,border-color .06s; text-align:center; padding:16px; }
  #buzzBtn.armed{ color:var(--phosphor); border-color:var(--phosphor); background:rgba(53,255,110,0.1); box-shadow:0 0 30px rgba(53,255,110,0.2) inset; }
  #buzzBtn.armed.pressed{ background:rgba(53,255,110,0.3); box-shadow:0 0 40px rgba(53,255,110,0.4) inset; }
  #buzzBtn.won{ color:var(--amber); border-color:var(--amber); background:rgba(255,176,0,0.15); box-shadow:0 0 40px rgba(255,176,0,0.35) inset; animation:pulse 0.8s infinite; }
</style>
</head>
<body>
<header>
  <div class="logo"><span>BUZZER</span></div>
  <div class="toolbar">
    <button class="icon-btn" id="btnLang" title="Language">EN</button>
    <button class="icon-btn" id="btnTheme" title="Theme">🌙</button>
    <button class="icon-btn" id="btnFullscreen" title="Fullscreen">⛶</button>
  </div>
</header>
<div class="status-row"><div class="dot connecting" id="dot"></div><span id="statusLabel">Łączenie z ekranem…</span></div>
<div id="nameRow"><input type="text" id="inputName" maxlength="16" placeholder="Twoje imię"></div>
<div id="scoreRow">WYNIK: <b id="scoreVal">0</b></div>
<div id="buzzBtn">CZEKAJ…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = { dot:$('dot'), statusLabel:$('statusLabel'), btnLang:$('btnLang'), btnTheme:$('btnTheme'),
    btnFullscreen:$('btnFullscreen'), inputName:$('inputName'), buzzBtn:$('buzzBtn'), scoreVal:$('scoreVal') };

  const STR = { pl:{ connecting:'Łączenie z ekranem…', connected:'Połączono z ekranem',
      disconnected:'Rozłączono — odśwież stronę', noCode:'Brak kodu ekranu w linku — zeskanuj QR jeszcze raz',
      errorPrefix:'Błąd: ', namePlaceholder:'Twoje imię', wait:'CZEKAJ…', ready:'BZZZ!', won:'WYGRAŁEŚ!', locked:'ZABLOKOWANE' },
    en:{ connecting:'Connecting to screen…', connected:'Connected to screen',
      disconnected:'Disconnected — refresh the page', noCode:'No screen code in the link — scan the QR again',
      errorPrefix:'Error: ', namePlaceholder:'Your name', wait:'WAIT…', ready:'BUZZ!', won:'YOU WON!', locked:'LOCKED' } };
  let lang='pl', statusState='connecting', armed=false, iWon=false, score=0;
  function t(k){ return STR[lang][k]; }
  function renderStatus(){ el.statusLabel.textContent = t(statusState); }
  function renderBtn(){
    el.buzzBtn.classList.remove('armed','won','pressed');
    if (iWon){ el.buzzBtn.textContent = t('won'); el.buzzBtn.classList.add('won'); }
    else if (armed){ el.buzzBtn.textContent = t('ready'); el.buzzBtn.classList.add('armed'); }
    else { el.buzzBtn.textContent = t('locked'); }
  }
  function renderStaticTexts(){ el.inputName.placeholder = t('namePlaceholder'); renderStatus(); renderBtn(); }
  el.btnLang.addEventListener('click', () => { lang=lang==='pl'?'en':'pl'; el.btnLang.textContent=lang==='pl'?'EN':'PL'; renderStaticTexts(); });
  el.btnTheme.addEventListener('click', () => { document.body.classList.toggle('light'); el.btnTheme.textContent = document.body.classList.contains('light')?'☀️':'🌙'; });
  el.btnFullscreen.addEventListener('click', () => { if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{});} else { document.exitFullscreen().catch(()=>{});} });

  const params = new URLSearchParams(window.location.search);
  const hostId = params.get('code');
  let conn = null, myId = null;

  function sendName(){ if (conn && conn.open) conn.send({ name: el.inputName.value.trim().slice(0,16) }); }
  let nameDebounce=null;
  el.inputName.addEventListener('input', () => { clearTimeout(nameDebounce); nameDebounce=setTimeout(sendName, 300); });

  if (!hostId){ statusState='noCode'; el.dot.className='dot error'; renderBtn(); }
  else {
    statusState='connecting'; el.dot.className='dot connecting';
    const peer = new Peer();
    peer.on('open', (id) => {
      myId = id;
      conn = peer.connect(hostId, { reliable:false });
      conn.on('open', () => { statusState='connected'; el.dot.className='dot connected'; renderStatus(); sendName(); });
      conn.on('data', (data) => {
        if (!data) return;
        if (data.type==='state'){
          armed = !!data.armed;
          if (armed) iWon=false;
          if (!armed && data.winnerId){ iWon = (data.winnerId===myId); if(iWon) score++; el.scoreVal.textContent=score; }
          renderBtn();
        }
      });
      conn.on('close', () => { statusState='disconnected'; el.dot.className='dot error'; renderStatus(); });
    });
    peer.on('error', (err) => { el.statusLabel.textContent = t('errorPrefix')+err.type; el.dot.className='dot error'; });
  }

  const fire = (e) => {
    e.preventDefault();
    if (!armed) return;
    el.buzzBtn.classList.add('pressed');
    if (conn && conn.open) conn.send({ type:'buzz' });
  };
  el.buzzBtn.addEventListener('touchstart', fire, { passive:false });
  el.buzzBtn.addEventListener('mousedown', fire);

  renderStaticTexts();
})();
</script>
</body>
</html>
