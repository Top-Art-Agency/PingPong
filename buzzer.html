<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QUIZ — Ekran</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');
  :root{ --phosphor:#35FF6E; --phosphor-dim:#1B7A38; --bg:#050807; --bg2:#0A120D; --amber:#FFB000; --line:rgba(53,255,110,0.18); --scan-op:0.18; --vig-op:0.65; }
  body.light{ --phosphor:#12833F; --phosphor-dim:#6E9E82; --bg:#EEF3EE; --bg2:#FFFFFF; --amber:#B36A00; --line:rgba(18,131,63,0.18); --scan-op:0.03; --vig-op:0.06; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{ background:var(--bg); color:var(--phosphor); font-family:'Space Mono', monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; overflow-x:hidden; position:relative; transition:background .2s; }
  body::before{ content:""; position:fixed; inset:0; background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,var(--scan-op)) 3px, rgba(0,0,0,var(--scan-op)) 3px); pointer-events:none; z-index:50; mix-blend-mode:multiply; }
  body::after{ content:""; position:fixed; inset:0; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,var(--vig-op)) 100%); pointer-events:none; z-index:51; }
  header{ width:100%; max-width:1040px; padding:22px 20px 8px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .logo{ font-family:'Press Start 2P', monospace; font-size:22px; letter-spacing:2px; text-shadow:0 0 6px var(--phosphor), 0 0 18px rgba(53,255,110,0.5); }
  .logo span{ color:var(--amber); text-shadow:0 0 6px var(--amber), 0 0 18px rgba(255,176,0,0.5); }
  .subtitle{ font-size:12px; color:var(--phosphor-dim); letter-spacing:1px; margin-top:6px; }
  .toolbar{ display:flex; gap:8px; }
  .icon-btn{ font-family:'Space Mono', monospace; font-size:11px; background:transparent; color:var(--phosphor); border:1px solid var(--phosphor-dim); padding:8px 10px; border-radius:4px; cursor:pointer; min-width:38px; }
  .icon-btn:hover{ background:rgba(53,255,110,0.08); border-color:var(--phosphor); }
  main{ width:100%; max-width:1040px; padding:16px 20px 40px; display:grid; grid-template-columns:2fr 1fr; gap:22px; }
  @media (max-width:800px){ main{ grid-template-columns:1fr; } }
  #stage{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  #arena{ position:relative; width:100%; min-height:420px; border:2px solid var(--phosphor-dim); border-radius:6px; box-shadow:0 0 30px rgba(53,255,110,0.08) inset, 0 0 40px rgba(53,255,110,0.06); background:var(--bg2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:26px; text-align:center; }
  #stage:fullscreen, #stage:-webkit-full-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:var(--bg); width:100vw; height:100vh; padding:30px; }
  #stage:fullscreen #arena, #stage:-webkit-full-screen #arena{ width:min(94vw, 1100px); height:min(78vh, 700px); min-height:0; }

  /* setup view */
  #setupView{ width:100%; display:flex; flex-direction:column; gap:12px; align-items:center; }
  #setupView textarea{ width:100%; min-height:220px; font-family:'Space Mono', monospace; font-size:13px; line-height:1.6; background:rgba(53,255,110,0.03); color:var(--phosphor); border:1px solid var(--phosphor-dim); border-radius:8px; padding:12px; outline:none; resize:vertical; }
  #setupHint{ font-size:11px; color:var(--phosphor-dim); line-height:1.7; text-align:left; width:100%; }
  #setupHint b{ color:var(--phosphor); }
  #qrMini{ display:flex; flex-direction:column; align-items:center; gap:8px; font-size:11px; color:var(--phosphor-dim); background:#EAFFF0; padding:14px; border-radius:8px; box-shadow:0 0 20px rgba(53,255,110,0.3); }
  #qrMini img, #qrMini canvas{ width:180px !important; height:180px !important; }

  /* question view */
  #progressRow{ font-size:11px; color:var(--phosphor-dim); letter-spacing:1px; }
  #questionText{ font-family:'Press Start 2P', monospace; font-size:clamp(16px,3vw,24px); line-height:1.6; color:var(--phosphor); text-shadow:0 0 8px currentColor; max-width:640px; }
  #optionsGrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:640px; }
  @media (max-width:520px){ #optionsGrid{ grid-template-columns:1fr; } }
  .opt{ border:2px solid var(--phosphor-dim); border-radius:8px; padding:14px 12px; font-size:13px; display:flex; gap:10px; align-items:center; text-align:left; }
  .opt .letter{ font-family:'Press Start 2P', monospace; font-size:12px; color:var(--phosphor-dim); }
  .opt.correct{ border-color:var(--phosphor); background:rgba(53,255,110,0.12); box-shadow:0 0 14px rgba(53,255,110,0.3); }
  .opt.correct .letter{ color:var(--phosphor); }
  #winnerBanner{ font-family:'Press Start 2P', monospace; font-size:clamp(20px,4vw,32px); color:var(--amber); text-shadow:0 0 14px var(--amber); display:none; }

  #qrBox{ background:#EAFFF0; padding:12px; border-radius:8px; box-shadow:0 0 20px rgba(53,255,110,0.3); }
  #qrCanvas{ width:130px; height:130px; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button{ font-family:'Press Start 2P', monospace; font-size:11px; letter-spacing:1px; background:transparent; color:var(--phosphor); border:2px solid var(--phosphor); padding:12px 20px; border-radius:4px; cursor:pointer; text-shadow:0 0 6px var(--phosphor); box-shadow:0 0 10px rgba(53,255,110,0.15); }
  button:hover{ background:rgba(53,255,110,0.1); }
  button.secondary{ color:var(--amber); border-color:var(--amber); text-shadow:0 0 6px var(--amber); font-size:10px; padding:10px 16px; }
  button.ghost{ color:var(--phosphor-dim); border-color:var(--phosphor-dim); text-shadow:none; box-shadow:none; font-size:10px; padding:10px 16px; }
  #sidebar{ display:flex; flex-direction:column; gap:14px; }
  .panel{ border:1px solid var(--line); border-radius:8px; padding:14px; background:rgba(53,255,110,0.02); }
  .panel h3{ font-size:11px; letter-spacing:1px; color:var(--phosphor-dim); margin-bottom:10px; font-weight:normal; display:flex; justify-content:space-between; align-items:center; }
  .panel h3 a{ color:var(--phosphor); text-decoration:none; font-size:10px; border-bottom:1px dotted var(--phosphor); }
  #leaderboard{ display:flex; flex-direction:column; gap:6px; max-height:340px; overflow-y:auto; }
  .lb-row{ display:flex; justify-content:space-between; font-size:13px; padding:6px 8px; border-radius:4px; background:rgba(53,255,110,0.03); }
  .lb-row .n{ color:var(--phosphor); }
  .lb-row .s{ color:var(--amber); font-family:'Press Start 2P', monospace; font-size:12px; }
  .lb-row.empty{ color:var(--phosphor-dim); font-style:italic; }
  footer{ width:100%; max-width:1040px; padding:0 20px 30px; font-size:10.5px; line-height:1.7; color:var(--phosphor-dim); text-align:center; }
  footer b{ color:var(--phosphor); }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo"><span>QUIZ</span></div>
    <div class="subtitle" id="txtSubtitle">gracze dołączają skanując QR w dowolnym momencie</div>
  </div>
  <div class="toolbar">
    <button class="icon-btn" id="btnLang" title="Language">EN</button>
    <button class="icon-btn" id="btnTheme" title="Theme">🌙</button>
    <button class="icon-btn" id="btnFullscreen" title="Fullscreen">⛶</button>
  </div>
</header>
<main>
  <div id="stage">
    <div id="arena">

      <div id="setupView">
        <div id="qrMini"><div id="qrCanvasMini"></div><span id="playerCountLbl">0 graczy połączonych</span></div>
        <div id="savedSetsRow" style="width:100%;">
          <label id="lblSavedSets" style="font-size:10px; color:var(--phosphor-dim); letter-spacing:0.5px; display:block; margin-bottom:6px;">Wczytaj zapisany zestaw</label>
          <select id="savedSetsSelect" style="width:100%; font-family:'Space Mono', monospace; font-size:12px; background:rgba(53,255,110,0.04); color:var(--phosphor); border:1px solid var(--phosphor-dim); border-radius:6px; padding:8px 10px; outline:none;">
            <option value="">— brak —</option>
          </select>
        </div>
        <textarea id="quizText" spellcheck="false"></textarea>
        <div id="setupHint"></div>
      </div>

      <div id="questionView" style="display:none; width:100%;">
        <div id="progressRow">PYTANIE 1 / 5</div>
        <div id="questionText">Pytanie...</div>
        <div id="optionsGrid"></div>
        <div id="winnerBanner"></div>
      </div>

    </div>
    <div class="actions">
      <button id="btnPrimary">ROZPOCZNIJ QUIZ</button>
      <button class="secondary" id="btnResetScores">RESETUJ WYNIKI</button>
      <button class="ghost" id="btnEdit" style="display:none;">EDYTUJ PYTANIA</button>
    </div>
  </div>
  <div id="sidebar">
    <div class="panel">
      <h3><span id="lblLeaderboard">WYNIKI</span><a id="linkFullRanking" href="https://top-art-agency.github.io/ranking-gier/" target="_blank">Pełny ranking →</a></h3>
      <div id="leaderboard"><div class="lb-row empty" id="lbEmpty">Brak graczy jeszcze</div></div>
    </div>
  </div>
</main>
<footer id="footerText"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://top-art-agency.github.io/ranking-gier/scores.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = {
    txtSubtitle:$('txtSubtitle'), btnLang:$('btnLang'), btnTheme:$('btnTheme'), btnFullscreen:$('btnFullscreen'),
    setupView:$('setupView'), questionView:$('questionView'), quizText:$('quizText'), setupHint:$('setupHint'),
    savedSetsSelect:$('savedSetsSelect'), lblSavedSets:$('lblSavedSets'),
    qrCanvasMini:$('qrCanvasMini'), playerCountLbl:$('playerCountLbl'),
    progressRow:$('progressRow'), questionText:$('questionText'), optionsGrid:$('optionsGrid'), winnerBanner:$('winnerBanner'),
    btnPrimary:$('btnPrimary'), btnResetScores:$('btnResetScores'), btnEdit:$('btnEdit'),
    leaderboard:$('leaderboard'), lblLeaderboard:$('lblLeaderboard'), footerText:$('footerText')
  };

  const STR = { pl:{
      subtitle:'gracze dołączają skanując QR w dowolnym momencie',
      startQuiz:'ROZPOCZNIJ QUIZ', reveal:'POKAŻ ODPOWIEDŹ', next:'NASTĘPNE PYTANIE', finish:'ZAKOŃCZ QUIZ',
      resetScores:'RESETUJ WYNIKI', editQuestions:'EDYTUJ PYTANIA', leaderboardLbl:'WYNIKI', empty:'Brak graczy jeszcze',
      playersConnected:' graczy połączonych', question:'PYTANIE', nobody:'NIKT NIE ODPOWIEDZIAŁ POPRAWNIE',
      footer:'Wklej pytania w polu wyżej, kliknij „ROZPOCZNIJ QUIZ”. Gracze widzą te same odpowiedzi na telefonach — kto pierwszy trafi poprawną, zdobywa punkt. Format: pytanie, potem odpowiedzi w kolejnych liniach, poprawną oznacz gwiazdką na początku linii.',
      hint:'<b>Format:</b> pytanie w jednej linii, pod nim odpowiedzi (po jednej w linii), poprawną oznacz gwiazdką na początku. Pusta linia oddziela kolejne pytania.',
      savedSets:'Wczytaj zapisany zestaw'
    }, en:{
      subtitle:'players join by scanning the QR at any time',
      startQuiz:'START QUIZ', reveal:'REVEAL ANSWER', next:'NEXT QUESTION', finish:'FINISH QUIZ',
      resetScores:'RESET SCORES', editQuestions:'EDIT QUESTIONS', leaderboardLbl:'SCORES', empty:'No players yet',
      playersConnected:' players connected', question:'QUESTION', nobody:'NOBODY ANSWERED CORRECTLY',
      footer:'Paste questions in the box above, click "START QUIZ". Players see the same options on their phones — first correct answer scores the point. Format: question line, then answers on following lines, mark the correct one with a leading asterisk.',
      hint:'<b>Format:</b> question on one line, answers below (one per line), mark the correct one with a leading asterisk. A blank line separates questions.',
      savedSets:'Load a saved set'
    } };
  let lang='pl'; function t(k){ return STR[lang][k]; }

  const DEFAULT_TEXT =
`Stolica Polski?
Kraków
*Warszawa
Wrocław
Gdańsk

Ile to 6 x 7?
40
*42
44
48

Który pierwiastek ma symbol Au?
Srebro
Aluminium
*Złoto
Argon`;
  el.quizText.value = DEFAULT_TEXT;

  const players = new Map(); // connId -> {conn, name, score}
  let questions = [];
  let qIndex = 0;
  let quizState = 'setup'; // setup | active | revealed
  let answeredThisRound = new Set(); // connIds who already answered (right or wrong) this round
  let correctFoundBy = null; // connId of winner this round, or null

  function parseQuestions(text){
    const blocks = text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
    const out = [];
    blocks.forEach(b => {
      const lines = b.split('\n').map(l=>l.trim()).filter(Boolean);
      if (lines.length < 3) return;
      const prompt = lines[0];
      const opts = [];
      let correctIndex = -1;
      lines.slice(1).forEach((l, i) => {
        if (l.startsWith('*')){ correctIndex = opts.length; opts.push(l.slice(1).trim()); }
        else { opts.push(l); }
      });
      if (correctIndex === -1 || opts.length < 2) return;
      out.push({ prompt, options: opts, correctIndex });
    });
    return out;
  }

  function broadcast(msg){ players.forEach(p => { if (p.conn && p.conn.open) p.conn.send(msg); }); }
  function sendTo(connId, msg){ const p = players.get(connId); if (p && p.conn && p.conn.open) p.conn.send(msg); }

  function renderLeaderboard(){
    const arr = Array.from(players.values()).sort((a,b)=>b.score-a.score);
    if (arr.length===0){ el.leaderboard.innerHTML = '<div class="lb-row empty">'+t('empty')+'</div>'; return; }
    el.leaderboard.innerHTML = arr.map(p => {
      const dot = p.color ? '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+p.color+';margin-right:6px;"></span>' : '';
      return '<div class="lb-row"><span class="n">'+dot+(p.name?p.name.toUpperCase():'?')+'</span><span class="s">'+p.score+'</span></div>';
    }).join('');
  }
  function renderPlayerCount(){ el.playerCountLbl.textContent = players.size + t('playersConnected'); }

  function showSetup(){
    quizState='setup';
    el.setupView.style.display=''; el.questionView.style.display='none';
    el.btnPrimary.textContent = t('startQuiz'); el.btnEdit.style.display='none';
    broadcast({ type:'idle' });
  }
  function showQuestion(){
    quizState='active';
    answeredThisRound = new Set(); correctFoundBy = null;
    el.setupView.style.display='none'; el.questionView.style.display='';
    el.winnerBanner.style.display='none';
    const q = questions[qIndex];
    el.progressRow.textContent = t('question')+' '+(qIndex+1)+' / '+questions.length;
    el.questionText.textContent = q.prompt;
    el.optionsGrid.innerHTML = q.options.map((o,i) => '<div class="opt" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></div>').join('');
    el.btnPrimary.textContent = t('reveal');
    el.btnEdit.style.display='none';
    broadcast({ type:'question', prompt:q.prompt, options:q.options, qIndex, qTotal:questions.length });
  }
  function revealAnswer(winnerConnId){
    quizState='revealed';
    const q = questions[qIndex];
    document.querySelectorAll('.opt').forEach((node,i) => { if (i===q.correctIndex) node.classList.add('correct'); });
    if (winnerConnId){
      const p = players.get(winnerConnId);
      el.winnerBanner.textContent = (p && p.name ? p.name.toUpperCase() : '???') + ' +1';
    } else {
      el.winnerBanner.textContent = t('nobody');
    }
    el.winnerBanner.style.display='';
    el.btnPrimary.textContent = (qIndex < questions.length-1) ? t('next') : t('finish');
    broadcast({ type:'result', correctIndex:q.correctIndex, winnerId:winnerConnId||null, winnerName: winnerConnId ? (players.get(winnerConnId)||{}).name : null });
  }

  el.btnPrimary.addEventListener('click', () => {
    if (quizState==='setup'){
      questions = parseQuestions(el.quizText.value);
      if (questions.length===0){ alert(lang==='pl' ? 'Nie udało się rozpoznać żadnego pytania — sprawdź format.' : 'Could not parse any question — check the format.'); return; }
      qIndex=0; showQuestion();
    } else if (quizState==='active'){
      revealAnswer(null);
    } else if (quizState==='revealed'){
      if (qIndex < questions.length-1){ qIndex++; showQuestion(); }
      else { submitScoresToRanking(); showSetup(); }
    }
  });
  el.btnResetScores.addEventListener('click', () => { players.forEach(p=>p.score=0); renderLeaderboard(); });
  el.btnEdit.addEventListener('click', showSetup);

  // ---- Ranking (Firebase, przez wspólny scores.js) ----
  function submitScoresToRanking(){
    if (!window.ArcadeScores || !window.ArcadeScores.ready) return;
    players.forEach(p => { if (p.score > 0) window.ArcadeScores.submit('buzzer', p.name, p.score, p.color); });
  }

  function renderStaticTexts(){
    el.txtSubtitle.textContent = t('subtitle');
    el.footerText.textContent = t('footer');
    el.setupHint.innerHTML = t('hint');
    el.lblSavedSets.textContent = t('savedSets');
    el.lblLeaderboard.textContent = t('leaderboardLbl');
    renderPlayerCount();
    renderLeaderboard();
    if (quizState==='setup') el.btnPrimary.textContent = t('startQuiz');
    else if (quizState==='active') el.btnPrimary.textContent = t('reveal');
    else el.btnPrimary.textContent = (qIndex < questions.length-1) ? t('next') : t('finish');
  }
  el.btnLang.addEventListener('click', () => { lang=lang==='pl'?'en':'pl'; el.btnLang.textContent=lang==='pl'?'EN':'PL'; renderStaticTexts(); });
  el.btnTheme.addEventListener('click', () => { document.body.classList.toggle('light'); el.btnTheme.textContent = document.body.classList.contains('light')?'☀️':'🌙'; });
  el.btnFullscreen.addEventListener('click', () => { if(!document.fullscreenElement){ (document.getElementById('stage')||document.documentElement).requestFullscreen().catch(()=>{});} else { document.exitFullscreen().catch(()=>{});} });

  const peer = new Peer();
  peer.on('open', (id) => {
    const dir = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')+1);
    const url = new URL(dir + 'buzzer-controller.html', window.location.origin);
    url.searchParams.set('code', id);
    new QRCode(el.qrCanvasMini, { text:url.toString(), width:180, height:180, colorDark:'#0A120D', colorLight:'#EAFFF0' });
  });
  peer.on('error', (err) => { el.questionText.textContent = 'Error: '+err.type; });
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      const id = conn.peer;
      players.set(id, { conn, name:null, color:null, score:0 });
      renderLeaderboard(); renderPlayerCount();
      if (quizState==='active'){
        const q = questions[qIndex];
        conn.send({ type:'question', prompt:q.prompt, options:q.options, qIndex, qTotal:questions.length });
      }
      conn.on('data', (data) => {
        if (!data) return;
        if (data.name !== undefined){ const p=players.get(id); if(p){ p.name = data.name?data.name.trim().slice(0,16):null; renderLeaderboard(); } }
        if (data.color !== undefined){ const p=players.get(id); if(p){ p.color = data.color||null; renderLeaderboard(); } }
        if (data.type==='answer' && quizState==='active' && !correctFoundBy && !answeredThisRound.has(id)){
          answeredThisRound.add(id);
          const q = questions[qIndex];
          if (data.index === q.correctIndex){
            correctFoundBy = id;
            const p = players.get(id); if (p) p.score++;
            renderLeaderboard();
            revealAnswer(id);
          } else {
            sendTo(id, { type:'wrongPrivate' });
          }
        }
      });
      conn.on('close', () => { players.delete(id); renderLeaderboard(); renderPlayerCount(); });
    });
  });

  // ---- Wczytywanie zapisanych zestawów pytań (z osobnego repo edytora) ----
  let savedSets = [];
  function loadSavedSetsList(){
    if (!window.ArcadeScores || !window.ArcadeScores.ready) return;
    window.ArcadeScores.listQuestionSets(rows => {
      savedSets = rows;
      const current = el.savedSetsSelect.value;
      el.savedSetsSelect.innerHTML = '<option value="">— brak —</option>' +
        rows.map(s => '<option value="'+s.id+'">'+(s.name||s.id)+'</option>').join('');
      if (rows.some(s=>s.id===current)) el.savedSetsSelect.value = current;
    });
  }
  el.savedSetsSelect.addEventListener('change', () => {
    const id = el.savedSetsSelect.value;
    if (!id) return;
    const set = savedSets.find(s=>s.id===id);
    if (set) el.quizText.value = set.text || '';
  });
  loadSavedSetsList();

  showSetup();
  renderStaticTexts();
})();
</script>
</body>
</html>
